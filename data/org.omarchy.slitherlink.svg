<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Omarchy Slitherlink: Jewel loop and dot matrix on dark squircle -->
  <rect x="7" y="7" width="498" height="498" rx="105" fill="#222730" stroke="#81a1c1" stroke-width="14"/>

  <!-- Loop Path -->
  <path d="M 120 120 L 392 120 L 392 256 L 256 256 L 256 392 L 120 392 Z"
        fill="rgba(129, 161, 193, 0.12)"
        stroke="#81a1c1"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Grid of Dots -->
  <!-- Row 1 -->
  <circle cx="120" cy="120" r="14" fill="#a3be8c"/>
  <circle cx="256" cy="120" r="12" fill="#434c5e"/>
  <circle cx="392" cy="120" r="14" fill="#88c0d0"/>

  <!-- Row 2 -->
  <circle cx="120" cy="256" r="12" fill="#434c5e"/>
  <circle cx="256" cy="256" r="14" fill="#ebcb8b"/>
  <circle cx="392" cy="256" r="14" fill="#d5967a"/>

  <!-- Row 3 -->
  <circle cx="120" cy="392" r="14" fill="#b48ead"/>
  <circle cx="256" cy="392" r="14" fill="#a3be8c"/>
  <circle cx="392" cy="392" r="12" fill="#434c5e"/>

  <!-- Center Clue Number (3) in cell (0, 0) -->
  <text x="188" y="202"
        font-family="JetBrainsMono Nerd Font, monospace, sans-serif"
        font-size="48"
        font-weight="bold"
        fill="#ebcb8b"
        text-anchor="middle">3</text>

  <!-- Cell (0, 1) clue (2) -->
  <text x="324" y="202"
        font-family="JetBrainsMono Nerd Font, monospace, sans-serif"
        font-size="48"
        font-weight="bold"
        fill="#88c0d0"
        text-anchor="middle">2</text>

  <!-- Cell (1, 0) clue (2) -->
  <text x="188" y="338"
        font-family="JetBrainsMono Nerd Font, monospace, sans-serif"
        font-size="48"
        font-weight="bold"
        fill="#a3be8c"
        text-anchor="middle">2</text>
</svg>
